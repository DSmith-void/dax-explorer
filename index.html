<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="DAX Execution Explorer visually explains how DAX expressions are evaluated."
    />
    <title>DAX Execution Explorer</title>
    <script>
      // Apply a saved theme before first paint to avoid a light/dark flash.
      // Must stay in sync with THEME_STORAGE_KEY in src/app/useThemePreference.ts.
      try {
        var t = localStorage.getItem('dax-explorer-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
